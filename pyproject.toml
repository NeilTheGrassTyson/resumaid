[project]
name = "resumaid"
version = "0.1.0"
description = "Personal job-search copilot: discover, score, queue. A human approves and submits."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "rich>=13.7",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
resumaid = "resumaid.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumaid"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer and FastAPI express their interfaces through calls in argument defaults; B008 is a
# false positive against both.
"src/resumaid/cli.py" = ["B008"]
"src/resumaid/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["live: hits a real public API; deselected by default"]

[tool.mypy]
python_version = "3.11"
packages = ["resumaid"]
mypy_path = "src"
ignore_missing_imports = true
